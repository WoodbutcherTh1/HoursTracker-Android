version: 2

updates:
  # GitHub Actions: all updates arrive in one weekly pull request.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Jerusalem
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  # Gradle: the wrapper, plugins and the version catalog.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Asia/Jerusalem
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build(deps)"
    groups:
      # Minor and patch updates share one pull request; majors stay separate.
      minor-and-patch:
        update-types: ["minor", "patch"]
    ignore:
      # JUnit stays on the approved 5.x line; moving to 6.x needs the owner's approval.
      - dependency-name: "org.junit:junit-bom"
        update-types: ["version-update:semver-major"]
